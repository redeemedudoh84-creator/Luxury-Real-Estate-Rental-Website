<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rufina:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/CSS/contact.css">
    <link rel="shortcut icon"
        href="https://cdn.vectorstock.com/i/1000v/34/96/real-estate-logo-house-roof-related-to-property-vector-26173496.jpg"
        type="image/x-icon">
    <link rel="stylesheet" href="/CSS/villaspage.css">
    <title>Document</title>
</head>

<body>
    <section class="contact-nav-bar">

        <div class="contact-nav-bar-wrapper">

            <div class="contact-luxury-text-wrapper">

                <p class="contact-luxury-text">
                    <a href="/HTML/index.html" class="no-underline">LUXURY RENTALS</a>
                </p>

            </div>

            <div class="contact-navigations-wrapper">

                <ul class="contact-navigations">

                    <li class="contact-villas-text">
                        <a href="/HTML/villaspage.html" class="no-underline">VILLAS</a>
                    </li>

                    <li class="contact-villas-text">
                        <a href="/HTML/about.html" class="no-underline">ABOUT US</a>
                    </li>

                    <li class="contact-villas-text">
                        <a href="/HTML/contact.html" class="no-underline">CONTACT</a>
                    </li>

                </ul>

            </div>

        </div>

    </section>

    <section class="home-page-cta-image">
    </section>

    <section class="about-us-cta">

        <div class="about-us-cta-wrapper">

            <div class="about-us-cta-left">

                <div class="about-us-cta-left-wrap">

                    <div class="about-us-cta-left-top">

                        <h2>
                            Let’s connect
                        </h2>

                    </div>

                    <div class="about-us-cta-left-middle">

                        <p class="about-us-cta-left-middle-title">
                            <span>Phone</span>
                            <span>+385 91 322 8444</span>
                        </p>

                        <p class="about-us-cta-left-middle-title">
                            <span>Email</span>
                            <span>prospekt@prospekt.hr</span>
                        </p>

                        <p class="about-us-cta-left-middle-title">
                            <span>Address</span>
                            <span>
                                Prospekt Ltd <br>
                                Drazice 138, 51 000 Rijeka <br>
                                Croatia
                            </span>
                        </p>
                    </div>

                    <div class="about-us-cta-left-bottom">

                        <div class="contact-hero-svg-wrapper">

                            <div class="svg-holder">
                                <button type="button" aria-label="Facebook"><img
                                        src="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/icons/brand-facebook.svg"
                                        alt="">
                                </button>
                                </a>
                            </div>

                            <div class="svg-holder">
                                <button type="button" aria-label="Youtube"><img
                                        src="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/icons/brand-youtube.svg"
                                        alt="">
                                </button>
                            </div>

                            <div class="svg-holder">
                                <button type="button" aria-label="Whatsapp"><img
                                        src="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/icons/brand-whatsapp.svg"
                                        alt="">
                                </button>
                            </div>

                        </div>


                    </div>

                </div>

            </div>

            <div class="about-us-cta-right">

                <div class="contact-form-wrapper">

                    <div class="contact-form">

                        <div class="contact-form-top">

                            <h2>We’d love to hear from you</h2>

                        </div>

                        <div class="contact-form-middle">

                            <form class="form">

                                <div class="form-row">

                                    <div class="input-wrapper">

                                        <input type="text" id="name" name="name" placeholder=" " required>
                                        <label for="name" class="label-text">Your Name</label>

                                    </div>

                                    <div class="input-wrapper">

                                        <input type="email" id="email" name="email" placeholder=" " required>
                                        <label for="email" class="label-text">Email</label>

                                    </div>

                                </div>

                                <div class="input-wrapper">
                                    <textarea id="message" name="message" placeholder=" " required></textarea>
                                    <label for="message" class="label-text">Message</label>
                                </div>

                                <div class="checkbox-group">

                                    <input type="checkbox" id="terms" name="terms" required>
                                    <label for="terms" class="label-text">
                                        I accept the <a href="terms.html" target="_blank">Terms and conditions</a>
                                    </label>

                                </div>

                            </form>


                        </div>

                        <div class="contact-form-bottom">

                            <button type="submit" class="sendbtn" id="submitBtn" disabled>SEND</button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <script src="/JS/villaspage.js"></script>
</body>

</html>
